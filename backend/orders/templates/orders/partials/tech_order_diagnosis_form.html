<section class="panel">
  <div class="panel__body">
    <div class="section-title">
      <h2>Diagnoza i rozliczenie</h2>
      <p>Wpisz wynik sprawdzenia sprzętu, wykonane czynności i końcowy koszt naprawy.</p>
    </div>

    <form method="post">
      {% csrf_token %}
      <input type="hidden" name="action" value="update_diagnosis" />

      <div class="field">
        <label>Diagnoza usterki</label>
        <textarea name="diagnosis" rows="4">{{ order.diagnosis }}</textarea>
      </div>

      <div class="field section">
        <label>Wykonane czynności</label>
        <textarea name="repair_notes" rows="4">{{ order.repair_notes }}</textarea>
      </div>

      <div class="form-grid section">
        <div class="field">
          <label>Koszt końcowy</label>
          <input type="number" name="final_price" min="0" step="0.01" value="{{ order.final_price|default_if_none:'' }}" />
        </div>
      </div>

      <div class="acceptance-summary">
        <span class="metric__label">Akceptacja naprawy</span>
        {% if order.customer_accepted_repair %}
          <span class="status-badge">Zaakceptowana przez klienta</span>
        {% else %}
          <span class="status-badge">Oczekuje na decyzję klienta</span>
        {% endif %}
      </div>

      <div class="button-row">
        <button type="submit">Zapisz diagnozę</button>
      </div>
    </form>
  </div>
</section>
