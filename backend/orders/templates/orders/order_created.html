{% extends "orders/base.html" %}

{% block title %}Zlecenie przyjęte | Serwis komputerowy{% endblock %}

{% block content %}
  <div class="page-heading">
    <div>
      <h1>Zlecenie zostało przyjęte</h1>
      <p>Numer zlecenia zachowaj do śledzenia statusu.</p>
    </div>
  </div>

  <section class="panel">
    <div class="panel__body">
      <div class="metric">
        <span class="metric__label">Numer zlecenia</span>
        <span class="metric__value">{{ order_number }}</span>
      </div>

      <div class="button-row">
        <a class="button" href="/track/">Sprawdź status</a>
        <a class="button button--ghost" href="/services/">Wróć do katalogu</a>
      </div>
    </div>
  </section>
{% endblock %}
