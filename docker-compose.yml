services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: serwis_db
      POSTGRES_USER: serwis_user
      POSTGRES_PASSWORD: serwis_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U serwis_user -d serwis_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    environment:
      DEBUG: "true"
      SECRET_KEY: "django-insecure-local-docker-key"
      ALLOWED_HOSTS: "localhost,127.0.0.1"
      POSTGRES_DB: serwis_db
      POSTGRES_USER: serwis_user
      POSTGRES_PASSWORD: serwis_password
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      SITE_URL: "http://127.0.0.1:8000"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
